name: Accelerator validation

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Accelerator to validate on a configured self-hosted runner
        type: choice
        options: [cuda, ascend]
        required: true

permissions:
  contents: read

jobs:
  cuda:
    if: inputs.accelerator == 'cuda'
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.11"
      - name: Install CUDA test environment
        run: |
          uv venv --python 3.12
          uv pip install --torch-backend=cu130 --group dev -e . 'torch~=2.14.0'
      - name: Run CUDA hardware tests
        env:
          TORCH_PRISMA_TEST_DEVICE: cuda
        run: .venv/bin/python -m pytest -m cuda

  ascend:
    if: inputs.accelerator == 'ascend'
    runs-on: [self-hosted, linux, ascend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Ascend hardware tests
        env:
          TORCH_PRISMA_TEST_DEVICE: ascend
        run: python3 -m pytest -m ascend
