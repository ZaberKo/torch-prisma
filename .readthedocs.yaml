version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install uv
    build:
      html:
        - python -m uv run --locked --isolated --only-group docs zensical build --strict
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html"
      - cp -a site/. "$READTHEDOCS_OUTPUT/html/"
