version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install uv==0.9.11
    build:
      html:
        - uv run --locked --isolated --only-group docs --python "$(command -v python)" zensical build --strict
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html"
      - cp -a site/. "$READTHEDOCS_OUTPUT/html/"
